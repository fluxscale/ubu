name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      TAG_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${TAG_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Build & Package
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x Distribution/DMG/create-dmg.sh
          Distribution/DMG/create-dmg.sh "$APP_VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ubu.dmg
          generate_release_notes: true
